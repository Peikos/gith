[package]
name = "gith"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rand = "0.8"
rusqlite = { version = "0.34", features = ["bundled"] }
shlex = "1"
russh = "0.50"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
